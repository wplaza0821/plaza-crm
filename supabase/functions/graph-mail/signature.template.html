<!-- Plaza & Associates — outbound signature, matching the Outlook original.
     Layout is a single column: name, title, logo, address, phones, website —
     the logo sits between the title and the address, as it does in Outlook.

     Set with:
       supabase secrets set --project-ref zhxwkntrndaeqtkmbtsh \
         GRAPH_SIGNATURE_HTML="$(cat signature.html)"

     Inline styles and explicit img width/height are deliberate: Outlook drops
     <style> blocks and several clients ignore CSS sizing. -->
<br><br>
<div style="font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#333333;line-height:1.45;">
  <div>Regards,</div>
  <div style="height:14px;line-height:14px;">&nbsp;</div>
  <div style="font-weight:bold;color:#020000;">WILLIAM PLAZA</div>
  <div>Principal</div>
  <div style="height:10px;line-height:10px;">&nbsp;</div>
  <!-- cid: refers to the copy graph-mail attaches to the message itself, so the
       logo renders even when the client blocks remote images. Sized to the
       native 600x332 aspect. -->
  <div>
    <img src="cid:plazalogo" alt="Plaza &amp; Associates" width="200" height="111"
         style="display:block;border:0;outline:none;text-decoration:none;">
  </div>
  <div style="height:10px;line-height:10px;">&nbsp;</div>
  <div>2222 Ponce de Leon Boulevard</div>
  <div>Coral Gables, Florida 33134</div>
  <div>O: (786) 310-5428 ext. 1</div>
  <div>C: (305) 469-1120</div>
  <div><a href="https://www.plazaandassociates.com" style="color:#1f6581;">www.plazaandassociates.com</a></div>
</div>
