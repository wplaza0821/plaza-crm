<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plaza CRM</title>
<!-- Home-screen install support (pattern ported from Plazacore). Lets William add
     the CRM to his iPhone home screen and run it without Safari chrome. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plaza CRM">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<style>
/* ===== Plazacore design tokens (identical :root) ===== */
:root{
  --black:#020000; --black-soft:#1a1818; --ink:#333333;
  --gray-50:#FAFAFA; --gray-100:#F4F4F4; --gray-200:#E5E5E5; --gray-300:#D4D4D4;
  --gray-400:#888888; --gray-500:#666666; --gray-700:#333333;
  --accent:#1f6581; --accent-bg:#e8eff2;
  --green:#1f6581; --green-bg:#e8eff2;
  --yellow:#666666; --yellow-bg:#F4F4F4;
  --red:#cf2e2e;    --red-bg:#fbe9e9;
  --blue:#1f6581;   --blue-bg:#e8eff2;
  --purple:#333333; --purple-bg:#F4F4F4;
  --navy:#020000;   --navy-soft:#1a1818; --navy-deep:#020000;
  --gold:#020000;   --gold-dark:#020000;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 2px 8px rgba(0,0,0,.07);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --radius:4px; --radius-sm:4px;
  --sidebar:224px; --topbar:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--gray-100);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login / recover ---------- */
#login,#recover{position:fixed;inset:0;background:var(--gray-100);display:flex;
  align-items:center;justify-content:center;z-index:999;padding:16px}
.lbox{background:#FFFFFF;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:38px 34px;width:min(400px,94vw);box-shadow:var(--shadow-lg)}
.login-logo{width:180px;margin:0 auto 26px auto}
.login-logo svg{width:100%;height:auto;display:block}
.lbox .ls{color:var(--gray-400);font-size:11px;text-align:center;margin-bottom:24px;
  letter-spacing:2.5px;text-transform:uppercase}
.lbox input{width:100%;margin-bottom:11px}
.lbox button{width:100%}
#lerr,#nperr{color:var(--red);font-size:12.5px;min-height:18px;margin-top:9px;text-align:center}
.lnk{background:none;border:0;color:var(--accent);font-size:12.5px;cursor:pointer;
  padding:8px 0 0;width:100%;text-align:center}

/* ---------- app shell: HubSpot 3-zone (sidebar / topbar / canvas) ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}

/* left rail */
.rail{background:#FFFFFF;border-right:1px solid var(--gray-200);display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-logo{padding:18px 18px 14px;border-bottom:1px solid var(--gray-200)}
.rail-logo svg{width:112px;height:auto;display:block}
.rail-logo .sub{font-size:10px;color:var(--gray-400);letter-spacing:2.2px;
  text-transform:uppercase;margin-top:7px}
.nav{padding:10px 8px;flex:1}
.nav-lbl{font-size:10px;color:var(--gray-400);letter-spacing:1.6px;text-transform:uppercase;
  padding:12px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);
  color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:1px;
  border:1px solid transparent}
.nav a:hover{background:var(--gray-50)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600;
  border-color:#d3e2e8}
.nav a .ico{width:16px;text-align:center;flex:0 0 16px;opacity:.85}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--gray-400);font-variant-numeric:tabular-nums}
.nav a.on .cnt{color:var(--accent)}
.rail-foot{padding:12px;border-top:1px solid var(--gray-200);font-size:11.5px;color:var(--gray-400)}
.rail-foot b{display:block;color:var(--ink);font-size:12.5px;font-weight:600;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis}
.rail-foot button{margin-top:9px;width:100%;font-size:12px;padding:6px 10px}

/* topbar */
.main{display:flex;flex-direction:column;min-width:0}
.top{height:var(--topbar);background:#FFFFFF;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:40}
.top h1{font-size:16.5px;font-weight:600;color:var(--black);margin:0;white-space:nowrap}
.top .crumb{font-size:11px;color:var(--gray-400);letter-spacing:1.6px;text-transform:uppercase}
.search{margin-left:auto;position:relative}
.search input{width:270px;padding:7px 11px 7px 30px;font-size:13px}
.search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--gray-400);font-size:12px;pointer-events:none}
.canvas{padding:20px 22px 44px;min-width:0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;
  margin-bottom:18px}
.kpi{background:#FFFFFF;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:14px 16px}
.kpi small{display:block;color:var(--gray-400);font-size:10.5px;text-transform:uppercase;
  letter-spacing:1.1px;margin-bottom:5px}
.kpi b{font-size:23px;color:var(--black);font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--gray-400);margin-top:3px}

/* toolbar */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--gray-200);border-radius:var(--radius);
  overflow:hidden;background:#FFFFFF}
.seg button{border:0;background:#FFFFFF;padding:7px 14px;font-size:12.5px;color:var(--gray-500);
  border-right:1px solid var(--gray-200);border-radius:0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--black);color:#FFFFFF;font-weight:600}
input,select,textarea,button{font:inherit;color:var(--ink);background:#FFFFFF;
  border:1px solid var(--gray-200);border-radius:var(--radius);padding:7px 10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:150px;resize:vertical;font-family:inherit}
button{cursor:pointer;transition:all .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--black);color:#FFFFFF;border-color:var(--black);font-weight:600}
button.pri:hover{background:var(--black-soft);color:#FFFFFF;border-color:var(--black-soft)}
button.sm{padding:5px 11px;font-size:12px}

/* ---------- pipeline (kanban) ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--gray-50);border:1px solid var(--gray-200);
  border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.col-h{padding:11px 13px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;
  background:var(--gray-50);border-radius:var(--radius) var(--radius) 0 0}
.col-h .t{font-size:12px;font-weight:600;color:var(--black);text-transform:uppercase;
  letter-spacing:.8px;display:flex;align-items:center;gap:7px}
.col-h .n{background:var(--gray-200);color:var(--gray-500);border-radius:10px;
  padding:1px 7px;font-size:11px;font-weight:600}
.col-h .v{font-size:11.5px;color:var(--gray-400);margin-top:3px;font-variant-numeric:tabular-nums}
.col-b{padding:9px;overflow-y:auto;flex:1;min-height:60px}
.card{background:#FFFFFF;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--gray-300);transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--gray-300)}
.card.sel{border-color:var(--accent);border-left-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-bg)}
.card.pHIGH{border-left-color:var(--red)}
.card.pMEDIUM{border-left-color:var(--accent)}
.card.pLOW{border-left-color:var(--gray-300)}
.card .cn{font-size:13px;font-weight:600;color:var(--black);line-height:1.35;
  margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.card .cc{font-size:11.5px;color:var(--gray-500);margin-bottom:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .amt{font-size:12.5px;font-weight:600;color:var(--black);font-variant-numeric:tabular-nums}
.pill{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;white-space:nowrap}
.pill.pn{background:var(--gray-100);color:var(--gray-500);font-variant-numeric:tabular-nums}
.pill.HIGH{background:var(--red-bg);color:var(--red)}
.pill.MEDIUM{background:var(--accent-bg);color:var(--accent)}
.pill.LOW{background:var(--gray-100);color:var(--gray-500)}
.pill.od{background:var(--red-bg);color:var(--red)}
.pill.ok{background:var(--gray-100);color:var(--gray-400)}

/* ---------- table view ---------- */
.tbl-wrap{background:#FFFFFF;border:1px solid var(--gray-200);border-radius:var(--radius);
  overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--gray-50);text-align:left;padding:10px 13px;font-size:10.5px;
  color:var(--gray-500);text-transform:uppercase;letter-spacing:1px;font-weight:600;
  border-bottom:1px solid var(--gray-200);white-space:nowrap;position:sticky;top:0;cursor:pointer}
thead th:hover{color:var(--accent)}
tbody td{padding:10px 13px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--gray-50)}
tbody tr.sel{background:var(--accent-bg)}
td .nm{font-weight:600;color:var(--black)}
td .cl{font-size:11.5px;color:var(--gray-500)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- record drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,0,0,.32);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,96vw);background:#FFFFFF;
  border-left:1px solid var(--gray-200);box-shadow:var(--shadow-lg);z-index:61;
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dh{padding:18px 22px;border-bottom:1px solid var(--gray-200);position:relative}
.dh .x{position:absolute;top:14px;right:16px;border:0;background:none;font-size:20px;
  color:var(--gray-400);padding:4px 8px;line-height:1}
.dh .x:hover{color:var(--black)}
.dh h2{margin:0 0 5px;font-size:17.5px;font-weight:600;color:var(--black);
  line-height:1.35;padding-right:36px}
.dh .meta{font-size:12px;color:var(--gray-500)}
.dh .quick{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center}
.db{padding:0 22px 26px;overflow-y:auto;flex:1}
.grid2{display:grid;grid-template-columns:118px 1fr;gap:0}
.grid2 .k{font-size:11px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.9px;
  padding:9px 0;border-bottom:1px solid var(--gray-100);font-weight:600}
.grid2 .v{font-size:13px;padding:9px 0;border-bottom:1px solid var(--gray-100);min-width:0;
  word-break:break-word}
/* Manual deal-economics editor (record drawer). Inputs are 16px because iOS
   Safari auto-zooms the whole page on focus below that — the documented CRM
   pitfall. Verify with getComputedStyle, not by reading the CSS. */
.fee-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:9px;margin-top:10px}
.fee-edit label{display:flex;flex-direction:column;gap:3px;font-size:11px;
  font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em}
.fee-edit input,.fee-edit select{font-size:16px;padding:7px 9px;
  border:1px solid var(--border);border-radius:5px;background:var(--panel);
  color:var(--ink);min-height:38px;width:100%;box-sizing:border-box}
.fee-edit input:focus,.fee-edit select:focus{outline:2px solid var(--accent);
  outline-offset:-1px}
@media(max-width:430px){.fee-edit{grid-template-columns:1fr 1fr}}
.callout{border-radius:var(--radius);padding:11px 13px;margin:14px 0;font-size:12.5px;
  line-height:1.55}
.callout.na{background:var(--accent-bg);border:1px solid #d3e2e8;color:#174d63}
.callout.ev{background:var(--gray-50);border:1px solid var(--gray-200);color:var(--gray-500)}
.callout b{letter-spacing:.7px;font-size:10.5px;text-transform:uppercase}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--gray-200);margin:18px 0 0;
  position:sticky;top:0;background:#FFFFFF;z-index:2}
.tab{padding:9px 14px;font-size:13px;color:var(--gray-500);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--accent)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#tabbody{padding-top:14px}
.lb{display:block;font-size:11px;color:var(--gray-400);text-transform:uppercase;
  letter-spacing:.9px;margin-bottom:5px;font-weight:600}
.fl{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.ok{color:var(--accent);font-weight:600}
.err{color:var(--red)}
.empty{color:var(--gray-400);font-size:13px;padding:26px 4px;text-align:center}

/* ===== email timeline (HubSpot/Salesforce activity-feed pattern) ===== */
.thread{display:flex;flex-direction:column;gap:0}
.em{position:relative;padding:0 0 4px 44px;border:0;background:none;margin:0}
/* vertical connector line down the avatar rail */
.em:not(:last-child):before{content:'';position:absolute;left:15px;top:34px;bottom:0;
  width:1px;background:var(--gray-200)}
.avatar{position:absolute;left:0;top:4px;width:31px;height:31px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  letter-spacing:.3px;border:1px solid transparent;z-index:1}
.avatar.in{background:var(--accent-bg);color:var(--accent);border-color:#d3e2e8}
.avatar.out{background:var(--black);color:#FFFFFF;border-color:var(--black)}
.ecard{background:#FFFFFF;border:1px solid var(--gray-200);border-radius:var(--radius);
  margin-bottom:9px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.ecard:hover{border-color:var(--gray-300);box-shadow:var(--shadow-sm)}
.ecard.open{border-color:var(--gray-300);box-shadow:var(--shadow-sm)}
.ehd{padding:10px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ehd:hover{background:var(--gray-50)}
.er1{display:flex;align-items:baseline;gap:8px}
.ewho{font-size:13px;font-weight:600;color:var(--black);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:52%}
.everb{font-size:11.5px;color:var(--gray-400);white-space:nowrap}
.etime{margin-left:auto;font-size:11px;color:var(--gray-400);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.esub{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eprev{font-size:12px;color:var(--gray-400);line-height:1.5;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.emeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:9.5px;padding:1px 6px;border-radius:3px;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.chip.in{background:var(--accent-bg);color:var(--accent)}
.chip.out{background:var(--gray-100);color:var(--gray-500)}
.chip.kw{background:transparent;color:var(--gray-400);border:1px solid var(--gray-200)}
.chip.att{background:var(--gray-100);color:var(--gray-500);text-transform:none;
  letter-spacing:0;font-weight:500}
/* expanded body */
.ebd{border-top:1px solid var(--gray-100);padding:13px}
.parties{font-size:11.5px;color:var(--gray-500);line-height:1.7;margin-bottom:11px;
  padding-bottom:10px;border-bottom:1px solid var(--gray-100)}
.parties .pk{display:inline-block;width:26px;color:var(--gray-400);font-weight:600;
  text-transform:uppercase;font-size:10px;letter-spacing:.6px}
.mailbody{font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-wrap;
  word-break:break-word;max-height:420px;overflow-y:auto}
.mailbody a{color:var(--accent)}
.atts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.att{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);
  background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:5px 9px;max-width:100%}
.att .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.att .az{color:var(--gray-400);font-size:10.5px;white-space:nowrap}
.qtoggle{margin-top:11px;background:none;border:0;color:var(--gray-400);font-size:11.5px;
  padding:3px 0;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.qtoggle:hover{color:var(--accent)}
.qdots{display:inline-block;background:var(--gray-100);border:1px solid var(--gray-200);
  border-radius:3px;padding:0 6px;letter-spacing:1px;line-height:1.4;color:var(--gray-500)}
.quoted{display:none;margin-top:9px;padding:11px 13px;background:var(--gray-50);
  border-left:2px solid var(--gray-200);border-radius:0 var(--radius) var(--radius) 0;
  font-size:12px;line-height:1.6;color:var(--gray-500);white-space:pre-wrap;
  max-height:300px;overflow-y:auto}
.quoted.on{display:block}
/* reply composer */
.rbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-100)}
.rbox textarea{min-height:96px;font-size:13px;line-height:1.6}
.rhint{font-size:11px;color:var(--gray-400);margin-top:7px}
.olink{font-size:11.5px;color:var(--gray-400);text-decoration:none;margin-left:auto}
.olink:hover{color:var(--accent)}
.act{border-left:2px solid var(--gray-200);padding:0 0 15px 13px;margin-left:5px;position:relative}
.act:before{content:'';position:absolute;left:-5px;top:3px;width:8px;height:8px;
  border-radius:50%;background:var(--gray-300);border:2px solid #FFFFFF}
.ak{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.at{font-size:11px;color:var(--gray-400);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink);margin-top:3px;white-space:pre-wrap;line-height:1.55}

/* hamburger — hidden on desktop, shown on phones */
.burger{display:none;background:#FFFFFF;border:1px solid var(--gray-200);
  border-radius:var(--radius);width:38px;height:38px;font-size:17px;line-height:1;
  color:var(--ink);flex:0 0 38px;padding:0}
.burger:active{background:var(--gray-100)}
.navscrim{position:fixed;inset:0;background:rgba(2,0,0,.35);z-index:70;display:none}
.navscrim.on{display:block}

/* ============ PHONE / TABLET ============ */
@media(max-width:900px){
  :root{--sidebar:0px;--topbar:54px}
  .shell{grid-template-columns:1fr}
  /* rail becomes an off-canvas drawer instead of vanishing entirely */
  .rail{position:fixed;top:0;left:0;bottom:0;width:262px;max-width:82vw;z-index:71;
    transform:translateX(-100%);transition:transform .22s ease;height:100vh;
    box-shadow:var(--shadow-lg);display:flex}
  .rail.on{transform:translateX(0)}
  .burger{display:block}
  .top{padding:0 13px;gap:11px}
  .top h1{font-size:15.5px}
  .top .crumb{display:none}
  .search{margin-left:auto;flex:1;min-width:0}
  .search input{width:100%;font-size:15px}       /* >=16px avoids iOS zoom-on-focus */
  .canvas{padding:14px 13px 40px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
  .kpi{padding:11px 12px}
  .kpi b{font-size:19px}
  .kpi small{font-size:10px}
  /* board: single full-width column, stacked vertically */
  .board{flex-direction:column;overflow-x:visible;gap:10px}
  .col{flex:1 1 auto;width:100%;max-height:none}
  .col-b{max-height:none}

  .bar{gap:7px}

  .db{padding:0 16px 26px}

  .grid2{grid-template-columns:1fr;gap:0}

  .grid2 .v{padding:0 0 9px}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 12px;font-size:13px}
  /* email timeline: tighter rail, no truncation of who/subject */
  .em{padding-left:38px}

  .mailbody{max-height:none}
  .quoted{max-height:none}
  /* ---- Field-crew ergonomics (pattern ported from Plazacore 2026-07-10 pass) ----
     Plazacore learned these the hard way on Noel's phone; reuse rather than re-derive.
     1) 16px !important beats every more-specific rule, so a single line kills
        iOS zoom-on-focus everywhere instead of chasing each selector.
     2) 44px minimum touch targets per Apple HIG (small/ghost buttons were ~26px). */
  input,select,textarea{font-size:16px !important}   /* stops iOS zoom-on-focus */
  button,.tab,.nav a{min-height:44px}
  button.sm{min-height:36px;min-width:36px}
  .seg button{min-height:44px}
  .qtoggle{min-height:36px}
  .att{min-height:36px}
  .att .an{max-width:150px}
  /* tables scroll horizontally rather than squashing */
  .tbl-wrap{-webkit-overflow-scrolling:touch}
  table{min-width:660px}
  /* sticky context header while scrolling long lists (Plazacore pattern) */
  .kpis{position:relative}
}
@media(max-width:430px){

/* Notch / home-bar devices.
   NOTE: `viewport-fit=cover` lets content extend into the unsafe areas, so every
   fixed/edge-anchored surface needs an inset or it sits under the home bar or
   behind the notch. (Plazacore sets viewport-fit=cover but only uses 2 insets —
   worth covering more thoroughly here.) */
@supports(padding:max(0px)){
  .canvas{
    padding-bottom:max(40px,env(safe-area-inset-bottom));

<script>
const SB_URL='https://zhxwkntrndaeqtkmbtsh.supabase.co';
const SB_KEY='sb_publishable_FU92Md7Bi2WojPfUqtKCGw_7pG7Ul6s';
const FN=SB_URL+'/functions/v1/graph-mail';
const FN_DBX=SB_URL+'/functions/v1/dropbox-files';
const LS='plaza_crm_session';
let SESSION=null, DEALS=[], CUR=null, TAB='emails', VIEW='pipeline';
/* Rows for the currently open Documents tab, so copyDoc() can find a url by id. */
let DOCS_CACHE=[];
/* Email thread: show only correspondence the CLIENT is actually a participant in.
   Default ON — keyword-only matching let 33.8% noise through (vendors, robots,
   unrelated projects). Toggle in the Email thread tab to see all keyword matches. */
let CLIENT_ONLY=true;
let SORT={k:'project_no',dir:1}, FSTAGE='', FPRI='';

const STAGES=["Lead","Proposal Sent","Negotiation","Won-Pending Payment","Won","On Hold","Stale","Lost"];
const OPEN=["Lead","Proposal Sent","Negotiation","Won-Pending Payment"];
/* Stages removed from the pipeline. A retired stage is NOT deleted from the
   data, so any deal still sitting in one must stay visible: boardCols() appends
   a column for it, the filter lists it, and the drawer keeps it selectable.
   Once no deal carries it the column stops appearing on its own. */
const RETIRED_STAGES=["RFP Received"];
const liveRetired=()=>RETIRED_STAGES.filter(s=>DEALS.some(d=>d.stage===s));
const boardCols=()=>COLS.concat(liveRetired());
const stageOptions=cur=>STAGES.concat(
  (cur&&!STAGES.includes(cur))?[cur]:[]).concat(
  liveRetired().filter(s=>s!==cur));
/* Kanban columns mirror the real sales motion, left -> right */
const COLS=["Lead","Proposal Sent","Negotiation","Won-Pending Payment","Won","On Hold","Stale","Lost"];

const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>v?'$'+Number(v).toLocaleString():'';
const days=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return Math.floor((new Date().setHours(0,0,0,0)-d)/864e5);};

/* ---------------- auth ---------------- */
async function signIn(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'Sign-in failed');
  return d;
}
async function refresh(){
  if(!SESSION?.refresh_token) return false;
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:SESSION.refresh_token})});
  if(!r.ok){logout();return false;}
  SESSION=await r.json();
  SESSION.expires_at=Date.now()+(SESSION.expires_in||3600)*1000;
  localStorage.setItem(LS,JSON.stringify(SESSION));
  return true;
}
async function tok(){
  if(SESSION&&SESSION.expires_at&&Date.now()>SESSION.expires_at-90000) await refresh();
  return SESSION?.access_token;
}
function logout(){SESSION=null;localStorage.removeItem(LS);
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';}
document.getElementById('lbtn').onclick=async()=>{

  const box=document.getElementById('lerr'); box.textContent='Signing in...';
  try{
    SESSION=await signIn(e,p);
    SESSION.expires_at=Date.now()+(SESSION.expires_in||3600)*1000;
    localStorage.setItem(LS,JSON.stringify(SESSION));

  }catch(err){box.textContent=err.message;}
};
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lbtn').click();});
document.getElementById('out').onclick=logout;
document.getElementById('fpw').onclick=async()=>{

      {method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
       body:JSON.stringify({email:e})});
    if(r.status===429){box.innerHTML='<span class="err">Please wait a minute before requesting another link.</span>';return;}
    box.innerHTML='<span class="ok">Reset link sent &check; Check your inbox.</span>';
  }catch(err){box.innerHTML='<span class="err">'+esc(err.message)+'</span>';}
};

/* ---------------- data ---------------- */
async function api(path,opts={}){
  const t=await tok();
  const write=opts.method==='PATCH'||opts.method==='POST'||opts.method==='PUT';
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json',
      ...(write?{'Prefer':'return=representation'}:{}), ...(opts.headers||{})}});
  if(r.status===401){await refresh();throw new Error('session expired — retry');}
  const raw=await r.text();
  if(!r.ok){
    let msg=raw.slice(0,300);
    try{const j=JSON.parse(raw);msg=j.message||j.error||j.hint||msg;}catch(e){}
    throw new Error(msg||('HTTP '+r.status));
  }
  /* PostgREST returns an EMPTY body on 201/204 unless Prefer:return=representation.
     Calling r.json() on that throws — Safari: "The string did not match the expected
     pattern", Chrome: "Unexpected end of JSON input" — which surfaced as a bogus
     failure even though the write had already succeeded. Never parse an empty body. */
  if(!raw) return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
async function fn(payload){
  const t=await tok();
  const r=await fetch(FN,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function fnD(payload){
  const t=await tok();
  const r=await fetch(FN_DBX,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('recover').style.display='none';
  document.getElementById('app').style.display='block';
  try{
    const t=await tok();
    const u=await (await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t}})).json();
    if(u&&u.email) document.getElementById('who').textContent=u.email;
  }catch(e){}
  await load();
}
/* Contract value, HubSpot-style. A Plaza proposal is not one number:
   proposal_fee = one-time $ from the proposal document
   options_nte  = elective / not-to-exceed scope (William: include options)
   rate*term    = recurring engagements (William: include expected term)
   A monthly rate with NO stated term contributes 0 and is flagged, so an
   unknown duration can never silently inflate the pipeline. Falls back to the
   legacy `amount` column only when the new fields are absent. */
function dealValue(d){
  const fee=+d.proposal_fee||0, nte=+d.options_nte||0, ca=+d.ca_fee||0;
  const rate=+d.rate||0, term=+d.term_months||0;
  const rec=(d.rate_unit==='month'&&rate&&term)?rate*term:0;
  const v=fee+nte+ca+rec;
  return v||(+d.amount||0);
}
/* Phase split of the same contract value dealValue() returns.
   DESIGN = proposal fee + options/NTE  (the design-phase scope)
   CA     = CA/hourly fee + recurring rate x term  (construction administration)
   A legacy row carrying only the old scalar `amount` cannot be attributed to a
   phase, so it lands in `unsplit` rather than being silently called Design —
   design + ca + unsplit always equals dealValue(d). */
function dealParts(d){
  const fee=+d.proposal_fee||0, nte=+d.options_nte||0, ca=+d.ca_fee||0;
  const rate=+d.rate||0, term=+d.term_months||0;
  const rec=(d.rate_unit==='month'&&rate&&term)?rate*term:0;
  const design=fee+nte, caTotal=ca+rec;
  const known=design+caTotal;
  const unsplit=known?0:(+d.amount||0);
  return {design,ca:caTotal,unsplit,total:known||unsplit};
}
const sumParts=list=>list.reduce((a,d)=>{const p=dealParts(d);
  a.design+=p.design;a.ca+=p.ca;a.unsplit+=p.unsplit;a.total+=p.total;return a;},
  {design:0,ca:0,unsplit:0,total:0});
/* "$120,000 design · $18,000 CA" — omits a phase that is zero. */
function phaseLine(p){
  const bits=[];
  if(p.design) bits.push(money(p.design)+' design');
  if(p.ca) bits.push(money(p.ca)+' CA');
  if(p.unsplit) bits.push(money(p.unsplit)+' unsplit');
  return bits.join(' · ');
}
function valueNote(d){
  const bits=[];
  if(+d.proposal_fee) bits.push(money(+d.proposal_fee)+' fee');
  if(+d.options_nte) bits.push(money(+d.options_nte)+' options');
  if(+d.ca_fee) bits.push(money(+d.ca_fee)+' CA');
  if(+d.rate&&d.rate_unit==='month'){
    bits.push(money(+d.rate)+'/mo'+(d.term_months?' x'+d.term_months+'mo':' (term TBD)'));
  }
  if(+d.rate&&d.rate_unit==='project') bits.push(money(+d.rate)+'/project');
  if(+d.rate&&d.rate_unit==='letter') bits.push(money(+d.rate)+'/letter');
  if(!+d.ca_fee&&(d.fee_flags||[]).includes('hourly')) bits.push('+ hourly CA');
  return bits.join(' · ');
}
async function load(){
  DEALS=await api('deals_value?select=*&order=project_no.asc.nullslast');
  /* Attach Dropbox document counts so the board/table can show a badge without
     a per-card query. deal_primary_doc is a view over deal_documents (see
     migrations/004_deal_documents.sql). Wrapped in try/catch: a missing view
     must degrade to "no badge", never break the whole board. */
  try{
    const pd=await api('deal_primary_doc?select=deal_id,doc_count,signed_count,primary_name,primary_url&doc_count=gt.0');
    const byId={};pd.forEach(x=>byId[x.deal_id]=x);
    DEALS.forEach(d=>{const p=byId[d.id];
      d.doc_count=p?p.doc_count:0;
      d.doc_signed=p?p.signed_count:0;
      d.doc_name=p?p.primary_name:null;
      d.doc_url=p?p.primary_url:null;});
  }catch(e){console.warn('doc counts unavailable',e.message);}
  DEALS.forEach(d=>{
    d.days_since_contact=days(d.last_contact_date);
    d.days_since_proposal=days(d.proposal_sent_date);
    d.is_open=OPEN.includes(d.stage);
    d.overdue=d.is_open&&(d.days_since_contact||0)>=14;
  });
  paint();
}

/* ---------------- shell paint ---------------- */
const TITLES={pipeline:['Workspace','Pipeline'],deals:['Workspace','All deals'],
  tasks:['Workspace','Needs follow-up'],contacts:['Workspace','Contacts'],
  forecast:['Reports','Forecast'],ar:['Reports','A/R pending']};
function paint(){
  const t=TITLES[VIEW]||TITLES.pipeline;
  document.getElementById('crumb').textContent=t[0];
  document.getElementById('vtitle').textContent=t[1];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===VIEW));
  const open=DEALS.filter(d=>d.is_open);
  const od=open.filter(d=>d.overdue);
  const ar=DEALS.filter(d=>d.stage==='Won-Pending Payment');
  const cs=new Set(DEALS.map(d=>d.contact_email).filter(Boolean));
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('c-pipeline',DEALS.length); set('c-deals',DEALS.length);
  set('c-tasks',od.length); set('c-contacts',cs.size); set('c-ar',ar.length);
  kpis(); toolbar(); renderView();
}
function kpis(){
  // Stage sets must be DISJOINT. Previously `stage.startsWith('Won')` also
  // matched 'Won-Pending Payment', which is ALSO in OPEN and ALSO in A/R — so
  // the same dollars were counted three times and adding the two headline KPIs
  // double-counted them. Match against explicit lists instead of a prefix.
  const WON_CLOSED=['Won'];
  const open=DEALS.filter(d=>d.is_open), won=DEALS.filter(d=>WON_CLOSED.includes(d.stage));
  const od=open.filter(d=>d.overdue);
  const openP=sumParts(open), wonP=sumParts(won);
  const openVal=openP.total, wonVal=wonP.total;
  const ar=DEALS.filter(d=>d.stage==='Won-Pending Payment').reduce((a,b)=>a+dealValue(b),0);
  document.getElementById('kpis').innerHTML=`
   <div class="kpi"><small>Open pipeline</small><b>${money(openVal)||'$0'}</b>
     <div class="sub">${open.length} active deals</div>
     <div class="sub">${phaseLine(openP)||'—'}</div></div>
   <div class="kpi"><small>Won 2026</small><b>${money(wonVal)||'$0'}</b>
     <div class="sub">${won.length} deals closed</div>
     <div class="sub">${phaseLine(wonP)||'—'}</div></div>
   <div class="kpi"><small>Needs follow-up</small>
     <b style="color:${od.length?'var(--red)':'var(--black)'}">${od.length}</b>
     <div class="sub">14+ days no contact</div></div>
   <div class="kpi"><small>A/R pending</small><b>${money(ar)||'$0'}</b>
     <div class="sub">Won, awaiting payment</div></div>`;

/* Bottom-center toast; replaces silent failures on background writes. */
function toast(msg,isErr){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.toggle('err',!!isErr);t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);
}
function rows(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  return DEALS.filter(d=>{
    const hay=[d.name,d.client,d.contact_name,d.contact_email,d.project_no,d.next_action].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return false;
    if(FSTAGE&&d.stage!==FSTAGE)return false;
    if(FPRI&&d.priority!==FPRI)return false;
    if(VIEW==='tasks'&&!d.overdue)return false;

function renderView(){

/* kanban board */
function board(v,r){
  const pr={HIGH:0,MEDIUM:1,LOW:2};
  let h='<div class="board">';
  for(const st of boardCols()){
    const sub=r.filter(d=>d.stage===st)
      .sort((a,b)=>(pr[a.priority]-pr[b.priority])||((b.days_since_contact||0)-(a.days_since_contact||0)));
    const val=sub.reduce((a,b)=>a+dealValue(b),0);
    h+=`<div class="col" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropDeal(event,'${esc(st)}')"><div class="col-h">
        <div class="t">${esc(st)}<span class="n">${sub.length}</span></div>
        <div class="v">${money(val)||'—'}</div></div><div class="col-b">`;
    h+= sub.length? sub.map(d=>cardHTML(d)).join('') : '<div class="empty" style="padding:14px 4px;font-size:12px">Empty</div>';
    h+='</div></div>';
  }
  v.innerHTML=h+'</div>';
}
function cardHTML(d){
  /* card figure uses dealValue() so a card never disagrees with the column
     total it sits under (legacy `amount` is dealValue's fallback anyway). */
  const dv=dealValue(d);
  return `<div class="card p${esc(d.priority)} ${CUR&&CUR.id===d.id?'sel':''}" onclick="open_(${d.id})"
    draggable="true" ondragstart="dragDeal(event,${d.id})" ondragend="dragEnd(event)">

      <span class="pill ${esc(d.priority)}">${esc(d.priority)}</span>
      ${d.days_since_contact!=null?`<span class="pill ${d.overdue?'od':'ok'}">${d.days_since_contact}d</span>`:''}
      ${d.doc_count?`<span class="pill" title="${esc(d.doc_name||'')}" style="background:${d.doc_signed?'#1f6581':'#e8eaed'};color:${d.doc_signed?'#fff':'#3c4043'}">📄 ${d.doc_count}${d.doc_signed?' ✓':''}</span>`:''}
    </div></div>`;

/* table view */
/* `amount` is the legacy scalar and is NULL on every economics-model deal, so
   the old Amount column rendered "—" for them. Money columns are computed from
   dealParts() instead: Design | CA | Value. */
const COLDEF=[['project_no','Project'],['name','Deal'],['stage','Stage'],['priority','Priority'],
  ['design','Design'],['ca','CA'],['value','Value'],
  ['days_since_contact','Last contact'],['next_action','Next action']];
const COMPUTED={design:d=>dealParts(d).design, ca:d=>dealParts(d).ca, value:d=>dealParts(d).total};
function table(v,r){
  const dir=SORT.dir, k=SORT.k;
  const sorted=[...r].sort((a,b)=>{
    if(COMPUTED[k]) return (COMPUTED[k](a)-COMPUTED[k](b))*dir;
    let x=a[k],y=b[k];
    if(k==='amount'||k==='days_since_contact'){x=+x||0;y=+y||0;return (x-y)*dir;}
    return String(x==null?'':x).localeCompare(String(y==null?'':y))*dir;});
  let h='<div class="tbl-wrap"><table><thead><tr>';
  for(const [key,lbl] of COLDEF)
    h+=`<th onclick="sortBy('${key}')">${lbl}${SORT.k===key?(dir>0?' &#9650;':' &#9660;'):''}</th>`;
  h+='</tr></thead><tbody>';
  if(!sorted.length) h+=`<tr><td colspan="${COLDEF.length}"><div class="empty">No deals match.</div></td></tr>`;
  for(const d of sorted){
    const p=dealParts(d);
    h+=`<tr class="${CUR&&CUR.id===d.id?'sel':''}" onclick="open_(${d.id})">
      <td><span class="pill pn">${esc(d.project_no||'—')}</span></td>
      <td><div class="nm">${esc(d.name)}</div><div class="cl">${esc(d.client||'')}</div></td>
      <td>${esc(d.stage)}</td>
      <td><span class="pill ${esc(d.priority)}">${esc(d.priority)}</span></td>
      <td class="num">${money(p.design)||'—'}</td>
      <td class="num">${money(p.ca)||'—'}</td>
      <td class="num"><b>${money(p.total)||'—'}</b>${p.unsplit?'<div style="font-size:10px;color:var(--gray-400)">unsplit</div>':''}</td>
      <td class="num">${d.days_since_contact!=null?`<span class="${d.overdue?'err':''}">${d.days_since_contact}d</span>`:'—'}</td>
      <td style="max-width:280px;font-size:12px;color:var(--gray-500)">${esc((d.next_action||'—').slice(0,90))}</td></tr>`;
  }
  /* totals row so the phase split reads as a column sum, not just per-deal */
  const tp=sumParts(sorted);
  h+=`<tr style="background:var(--gray-50)">
      <td colspan="4"><b>Total (${sorted.length})</b></td>
      <td class="num"><b>${money(tp.design)||'—'}</b></td>
      <td class="num"><b>${money(tp.ca)||'—'}</b></td>
      <td class="num"><b>${money(tp.total)||'—'}</b></td>
      <td colspan="2"></td></tr>`;
  v.innerHTML=h+'</tbody></table></div>';
}
function sortBy(k){SORT.dir=(SORT.k===k)?-SORT.dir:1;SORT.k=k;renderView();}
/* contacts view */
function contacts(v){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const map={};
  DEALS.forEach(d=>{
    if(!d.contact_email)return;
    const key=d.contact_email.toLowerCase();
    (map[key]=map[key]||{name:d.contact_name,email:d.contact_email,client:d.client,deals:[]}).deals.push(d);
  });
  let list=Object.values(map);
  if(q) list=list.filter(c=>[c.name,c.email,c.client].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>b.deals.length-a.deals.length);
  let h='<div class="tbl-wrap"><table><thead><tr><th>Contact</th><th>Client</th><th>Deals</th><th>Value</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="4"><div class="empty">No contacts match.</div></td></tr>';
  for(const c of list){
    const val=c.deals.reduce((a,b)=>a+dealValue(b),0);
    h+=`<tr onclick="open_(${c.deals[0].id})">
      <td><div class="nm">${esc(c.name||'—')}</div><div class="cl">${esc(c.email)}</div></td>
      <td>${esc(c.client||'—')}</td>
      <td class="num">${c.deals.length}</td>
      <td class="num">${money(val)||'—'}</td></tr>`;
  }
  v.innerHTML=h+'</tbody></table></div>';
}
/* forecast view */
function forecast(v){
  let h='<div class="tbl-wrap"><table><thead><tr><th>Stage</th><th>Deals</th>'
    +'<th>Design</th><th>CA</th><th>Value</th><th>Share of pipeline</th></tr></thead><tbody>';
  const all=sumParts(DEALS);
  const tot=all.total||1;
  for(const st of boardCols()){
    const sub=DEALS.filter(d=>d.stage===st);
    if(!sub.length)continue;
    const p=sumParts(sub);
    const pct=Math.round(p.total/tot*100);
    h+=`<tr><td><b>${esc(st)}</b></td><td class="num">${sub.length}</td>
      <td class="num">${money(p.design)||'—'}</td>
      <td class="num">${money(p.ca)||'—'}</td>
      <td class="num">${money(p.total)||'—'}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:7px;background:var(--gray-100);border-radius:4px;overflow:hidden;min-width:70px">
          <div style="width:${pct}%;height:100%;background:var(--accent)"></div></div>
        <span style="font-size:11.5px;color:var(--gray-400);width:32px" class="num">${pct}%</span>
      </div></td></tr>`;
  }
  h+=`<tr style="background:var(--gray-50)"><td><b>Total</b></td>
      <td class="num"><b>${DEALS.length}</b></td>
      <td class="num"><b>${money(all.design)||'—'}</b></td>
      <td class="num"><b>${money(all.ca)||'—'}</b></td>
      <td class="num"><b>${money(all.total)}</b></td><td></td></tr>`;
  if(all.unsplit) h+=`<tr><td colspan="6" style="font-size:11.5px;color:var(--gray-400)">
      ${money(all.unsplit)} on legacy deals has no phase breakdown — set a proposal fee / CA fee to split it.</td></tr>`;
  v.innerHTML=h+'</tbody></table></div>';
}

async function saveStage(){
  const stage=document.getElementById('edStage').value, priority=document.getElementById('edPri').value;
  const st=document.getElementById('sst');st.textContent='Saving...';
  const prev=CUR.stage;
  try{
    /* Update the deal FIRST — it is the authoritative write. Logging the activity
       first meant any hiccup left an orphan stage_change row with the stage
       never actually changed. */
    await api('deals?id=eq.'+CUR.id,{method:'PATCH',body:JSON.stringify({stage,priority})});
    if(stage!==prev){
      try{
        await api('activities',{method:'POST',
          body:JSON.stringify({deal_id:CUR.id,kind:'stage_change',summary:`${prev} -> ${stage}`})});
      }catch(e){/* audit-log failure must never mask a successful stage change */}
    }
    await load(); CUR=DEALS.find(x=>x.id===CUR.id); draw();
    const s2=document.getElementById('sst'); if(s2) s2.textContent='Saved';
  }catch(e){st.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}

/* ---------------- drag-and-drop stage moves (HubSpot-style board) ---------------- */
let DRAG_ID=null;
function dragDeal(e,id){
  DRAG_ID=id;
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',String(id));}catch(_){/* old Safari */}
  e.target.classList.add('dragging');
}
function dragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.col.dropover').forEach(c=>c.classList.remove('dropover'));
}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('dropover');}
function dragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('dropover');}
async function dropDeal(e,stage){
  e.preventDefault();
  e.currentTarget.classList.remove('dropover');
  const id=DRAG_ID!=null?DRAG_ID:+(e.dataTransfer.getData('text/plain')||0);
  DRAG_ID=null;
  const d=DEALS.find(x=>x.id===id);
  if(!d||d.stage===stage)return;
  const prev=d.stage;
  /* optimistic: move the card immediately, revert if the write fails */
  d.stage=stage; d.is_open=OPEN.includes(stage);
  paint();
  try{
    await api('deals?id=eq.'+id,{method:'PATCH',body:JSON.stringify({stage})});
    try{
      await api('activities',{method:'POST',
        body:JSON.stringify({deal_id:id,kind:'stage_change',summary:`${prev} -> ${stage}`})});
    }catch(_){/* audit-log failure must never mask a successful stage change */}
    toast(`${d.name}: ${prev} → ${stage}`);
    await load();
  }catch(err){
    d.stage=prev; d.is_open=OPEN.includes(prev);
    paint();
    toast('Stage change failed: '+err.message,true);
  }
}

function dealFormHTML(d,isNew){

  h+=`<div><label class="lb">Stage</label><select id="dfStage">${stageOptions(d.stage).map(s=>`<option value="${esc(s)}"${s===(d.stage||'Lead')?' selected':''}>${esc(s)}${RETIRED_STAGES.includes(s)?' (retired)':''}</option>`).join('')}</select></div>`;
  h+=`<div><label class="lb">Priority</label><select id="dfPri">${['HIGH','MEDIUM','LOW'].map(s=>`<option${s===(d.priority||'MEDIUM')?' selected':''}>${s}</option>`).join('')}</select></div>`;
  if(isNew) h+=`<div><label class="lb">Proposal fee ($)</label><input id="dfFee" type="number" step="100" placeholder="editable later"></div>`;
  for(const [id,lbl,key,type,full] of DEAL_FIELDS){
    const val=key==='keywords'?(Array.isArray(d.keywords)?d.keywords.join(', '):''):(d[key]==null?'':d[key]);
    h+=`<div${full?' class="full"':''}><label class="lb">${lbl}</label>`;
    h+= type==='textarea'
      ? `<textarea id="${id}" style="min-height:64px">${esc(val)}</textarea>`
      : `<input id="${id}" type="${type}" value="${esc(val)}">`;
    h+='</div>';
  }
  return h+'</div>';
}
function readDealForm(isNew){
  const g=id=>document.getElementById(id).value.trim();
  const or=v=>v===''?null:v;
  const kws=g('dfKw').split(',').map(s=>s.trim()).filter(Boolean);
  const body={
    name:g('dfName'), client:or(g('dfClient')), project_no:or(g('dfProj')),
    contact_name:or(g('dfCName')), contact_email:or(g('dfCEmail')),
    stage:g('dfStage'), priority:g('dfPri'),
    proposal_sent_date:or(g('dfPSent')), last_contact_date:or(g('dfLast')),
    next_action:or(g('dfNAct')), next_action_due:or(g('dfNDue')),
    keywords:kws.length?kws:null, dropbox_folder:or(g('dfDbx')), evidence:or(g('dfEv')),
  };
  if(isNew){const f=g('dfFee'); if(f!=='') body.proposal_fee=+f;}
  return body;
}

async function saveDealForm(id){
  const st=document.getElementById('dfst');
  const body=readDealForm(id==null);
  if(!body.name){st.innerHTML='<span class="err">Deal name is required</span>';return;}
  st.textContent='Saving...';
  try{
    let rowId=id;
    if(id==null){
      const res=await api('deals',{method:'POST',body:JSON.stringify(body)});
      const row=Array.isArray(res)?res[0]:res;
      rowId=row&&row.id;
      try{
        await api('activities',{method:'POST',
          body:JSON.stringify({deal_id:rowId,kind:'created',summary:`Deal created in ${body.stage}`})});
      }catch(_){/* audit-log failure must never mask a successful create */}
      toast('Deal created');
    }else{
      await api('deals?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});
      toast('Deal updated');
    }
    await load();
    CUR=DEALS.find(x=>x.id===rowId)||null;
    if(CUR){TAB='edit';draw();}else closeDrawer();
  }catch(e){st.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}

/* Deleting is irreversible and there is no undo, so it takes a typed
   confirmation of the deal name — the same guard GitHub uses for repo
   deletion. A stray click can never destroy a record. */
function askDeleteDeal(){
  const d=CUR;
  document.getElementById('dzStart').style.display='none';
  document.getElementById('dzConfirm').innerHTML=`
    <div class="dz-confirm">
      <label class="lb">Type <b>${esc(d.name)}</b> to confirm</label>
      <input id="dzName" autocomplete="off" placeholder="${esc(d.name)}">
      <div class="fl">
        <button class="dz-btn" id="dzGo" onclick="deleteDeal(${d.id})" disabled>Delete permanently</button>
        <button onclick="loadEdit()">Cancel</button>
        <span id="dzst"></span>
      </div>
    </div>`;
  const inp=document.getElementById('dzName'), go=document.getElementById('dzGo');
  inp.oninput=()=>{go.disabled=inp.value.trim()!==d.name;};
  inp.focus();
}
async function deleteDeal(id){
  const d=DEALS.find(x=>x.id===id); if(!d) return;
  const st=document.getElementById('dzst'); st.textContent='Deleting...';
  const go=document.getElementById('dzGo'); if(go) go.disabled=true;
  try{
    /* Children first: activities and deal_documents both reference deals(id),
       so without ON DELETE CASCADE the deal row cannot go while they exist.
       deal_documents is rebuilt by the 7am sync, and with the deal gone it has
       nothing to re-attach to. */
    await api('activities?deal_id=eq.'+id,{method:'DELETE'});
    try{ await api('deal_documents?deal_id=eq.'+id,{method:'DELETE'}); }
    catch(e){ /* table may not exist yet in some environments — not fatal */ }
    await api('deals?id=eq.'+id,{method:'DELETE'});
    toast('Deleted '+d.name);
    closeDrawer();
    await load();
  }catch(e){
    st.innerHTML='<span class="err">'+esc(e.message)+'</span>';
    if(go) go.disabled=false;
  }
}

/* ---------- sent-mail cross-reference ----------
   A Dropbox folder holds every revision ever produced; only some were actually
   emailed to the client. This matches deal_documents rows against attachments
   on OUTBOUND messages (graph-mail direction 'out'), so the tab can say which
   revision the client actually holds — and so a fee is only ever scanned from
   a document the client received.

   Filenames are normalised before comparison: Outlook and re-saved copies vary
   the punctuation, so "Dome Proposal Rev2.pdf", "Dome_Proposal_Rev2.pdf" and
   "Dome Proposal Rev2 (1).pdf" must all match the same Dropbox file. */
const normName=s=>String(s||'').toLowerCase()
  .replace(/\.[a-z0-9]+$/,'')       // extension
  .replace(/\s*\(\d+\)\s*$/,'')     // " (1)" duplicate suffix
  .replace(/[\s_\-]+/g,' ')
  .trim();

let SENT_INDEX=null;   // {byName:Map, checked:bool, error:string|null}

async function buildSentIndex(){
  const out={byName:new Map(),checked:false,error:null};
  if(!CUR.contact_email){out.error='no client contact on this deal';return out;}
  try{
    const kws=(CUR.keywords&&CUR.keywords.length)?CUR.keywords:[CUR.contact_email];
    const ms=await fn({action:'search',keywords:kws,
      contact_email:CUR.contact_email,strict_client:true,sibling_keywords:[]});
    /* Only outbound messages carrying attachments are evidence of sending.
       Attachment names live in the per-message detail, not the search summary,
       so the list is capped to keep this to a handful of calls. */
    const sent=(ms||[]).filter(m=>m.direction==='out'&&m.hasAttachments).slice(0,25);
    for(const m of sent){
      let full=null;
      try{ full=await fn({action:'message',id:m.id}); }catch(_){ continue; }
      for(const a of (full.attachments||[])){
        const k=normName(a.name);
        if(!k) continue;
        const date=m.date||full.date||null;
        const prev=out.byName.get(k);
        if(!prev||String(date||'')>String(prev.date||'')){
          out.byName.set(k,{date,subject:m.subject||full.subject||''});
        }
      }
    }
    out.checked=true;
  }catch(e){ out.error=e.message; }
  return out;
}
/* A document counts as sent when its normalised name matches a sent attachment. */
function sentInfo(x){
  if(!SENT_INDEX||!SENT_INDEX.checked) return null;
  return SENT_INDEX.byName.get(normName(x.file_name))||null;
}

/* Live folder read. The Documents list is a 7am snapshot, so anything added to
   Dropbox today is invisible until tomorrow; this reads the folder now and
   reports what the snapshot is missing. Needs dropbox_folder set on the deal
   and the edge function deployed — otherwise it says so and the snapshot list
   stays exactly as it was. */
async function refreshDocsLive(){
  const box=document.getElementById('livedocs');
  if(!CUR.dropbox_folder){
    box.innerHTML=`<div class="empty" style="padding:10px">No Dropbox folder set on this deal —
      add one in the <a href="#" onclick="setTab('edit');return false" style="color:var(--accent)">Edit</a> tab to check live.</div>`;
    return;
  }
  box.innerHTML='<div class="empty" style="padding:10px">Reading Dropbox folder...</div>';
  try{
    const d=await fnD({action:'list',path:CUR.dropbox_folder});
    const files=(d.files||[]).filter(f=>!f.is_folder);
    const known=new Set((DOCS_CACHE||[]).map(x=>String(x.file_name||'').toLowerCase()));
    const missing=files.filter(f=>!known.has(String(f.name||'').toLowerCase()));
    if(!missing.length){
      box.innerHTML=`<div class="empty" style="padding:10px">Live check: ${files.length} file${files.length===1?'':'s'} in the folder, all already listed above.</div>`;
      return;
    }
    box.innerHTML=`<div style="margin:8px 0;font-size:11.5px;color:var(--gray-500)">
        <b>${missing.length}</b> file${missing.length===1?'':'s'} in Dropbox not yet in the 7am sync:</div>`
      +missing.map(f=>`<div class="act" style="display:flex;gap:10px;align-items:center">
        <span style="flex:0 0 18px;text-align:center">${f.is_pdf?'&#128196;':'&#128441;'}</span>
        <div style="flex:1;min-width:0">
          <div class="note" style="word-break:break-word"><b>${esc(f.name)}</b> <span class="chip">new</span></div>
          <div style="font-size:11px;color:var(--gray-500)">${f.modified?esc(relTime(f.modified)):''}${f.size?' · '+esc(fsize(f.size)):''}</div>
        </div>
      </div>`).join('');
  }catch(e){
    box.innerHTML=`<div class="empty" style="padding:10px"><span class="err">${esc(e.message)}</span><br>
      <span style="font-size:12px;color:var(--gray-400)">Live check needs the dropbox-files function deployed; the list above is the 7am snapshot and is unaffected.</span></div>`;
  }
}

/* ---------------- proposal fee scan (Documents tab) ----------------
   Scanning runs against a deal_documents row: prefer its Dropbox path, and fall
   back to its share URL, which the edge function can download via
   sharing/get_shared_link_file. A web_path row has neither, so its scan button
   is not rendered at all. */
function docScanTarget(x){
  const path=x.dropbox_path||x.path_lower||x.path||null;
  if(path) return {path};
  if(x.link_kind==='shared_link'&&x.url) return {shared_url:x.url};
  return null;
}
async function scanDoc(id){
  const x=(DOCS_CACHE||[]).find(y=>y.id===id); if(!x) return;
  const t=docScanTarget(x); if(!t) return;
  const out=document.getElementById('scanout');
  out.innerHTML='<div class="empty">Extracting text and scanning for amounts...</div>';
  try{
    const d=await fnD({action:'value',...t});
    const cs=d.candidates||[];
    const fname=d.file||x.file_name;
    if(!cs.length){out.innerHTML='<div class="empty">No dollar amounts found in '+esc(fname)+'.</div>';return;}
    out.innerHTML=`<div style="margin-top:12px"><label class="lb">Amounts found in ${esc(fname)}</label>`
      +cs.map(c=>`<div class="act" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="flex:0 0 auto;font-variant-numeric:tabular-nums">${money(c.amount)}</b>
        <div style="flex:1;min-width:120px;font-size:11.5px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.context)}">${esc(c.context)}</div>
        <button class="sm" onclick="applyFee('proposal_fee',${c.amount},'${esc(fname).replace(/'/g,'&#39;')}')">→ Design fee</button>
        <button class="sm" onclick="applyFee('ca_fee',${c.amount},'${esc(fname).replace(/'/g,'&#39;')}')">→ CA fee</button>
      </div>`).join('')+'</div>';
  }catch(e){
    out.innerHTML=`<div class="empty"><span class="err">${esc(e.message)}</span><br>
      <span style="font-size:12px;color:var(--gray-400)">Is the dropbox-files function deployed with Dropbox credentials?</span></div>`;
  }
}
/* A scanned amount lands in the economics model — proposal_fee (design phase)
   or ca_fee (CA phase), the caller's choice. fee_source records which PDF it
   came from, matching the "parsed from:" line the drawer already renders. */
async function applyFee(col,amount,file){
  const label=col==='ca_fee'?'CA fee':'Design fee';
  try{
    const body={[col]:amount,fee_verified_at:new Date().toISOString()};
    if(col==='proposal_fee') body.fee_source=file;
    await api('deals?id=eq.'+CUR.id,{method:'PATCH',body:JSON.stringify(body)});
    try{
      await api('activities',{method:'POST',
        body:JSON.stringify({deal_id:CUR.id,kind:'note',summary:`${label} set to ${money(amount)} from ${file}`})});
    }catch(_){/* audit-log failure must never mask the fee write */}
    toast(`${label} set to ${money(amount)}`);
    await load();CUR=DEALS.find(x=>x.id===CUR.id);draw();
  }catch(e){toast('Could not set fee: '+e.message,true);}
}

/* Manual override of deal economics. Empty input -> NULL, not 0, so "unknown"
   stays distinguishable from "zero" (an unknown term must keep contributing
   nothing to the pipeline rather than looking like a real $0 deal).
   Writes the deal first, then the audit activity, per the ordering lesson in
   saveStage(). */
async function saveEconomics(){
  const st=document.getElementById('fst'); st.textContent='Saving...';
  const num=id=>{const v=document.getElementById(id).value.trim(); return v===''?null:(+v);};
  const unit=document.getElementById('edUnit').value||null;
  const body={
    proposal_fee:num('edFee'), options_nte:num('edNte'),
    rate:num('edRate'), rate_unit:unit, term_months:num('edTerm'),
    ca_fee:num('edCa'), billed_to_date:num('edBilled'),
    fee_verified_at:new Date().toISOString()
  };
  if(body.rate!=null && !body.rate_unit){
    st.innerHTML='<span class="err">Pick a rate unit for a recurring rate</span>'; return;
  }
  if(body.term_months!=null && body.rate==null){
    st.innerHTML='<span class="err">Term needs a recurring rate</span>'; return;
  }
  try{
    await api('deals?id=eq.'+CUR.id,{method:'PATCH',body:JSON.stringify(body)});
    try{
      const parts=[];
      if(body.proposal_fee!=null)parts.push('fee '+money(body.proposal_fee));
      if(body.options_nte!=null)parts.push('options '+money(body.options_nte));
      if(body.rate!=null)parts.push('rate '+money(body.rate)+'/'+body.rate_unit);
      if(body.term_months!=null)parts.push('term '+body.term_months+'mo');
      if(body.ca_fee!=null)parts.push('CA '+money(body.ca_fee));
      if(body.billed_to_date!=null)parts.push('billed '+money(body.billed_to_date));
      await api('activities',{method:'POST',body:JSON.stringify(
        {deal_id:CUR.id,kind:'note',summary:'Economics updated: '+(parts.join(' · ')||'cleared')})});
    }catch(e){/* audit failure must not mask a successful save */}
    await load(); CUR=DEALS.find(x=>x.id===CUR.id); draw();
    const s2=document.getElementById('fst'); if(s2) s2.textContent='Saved';
  }catch(e){st.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}
/* ---- email helpers ---- */
const initials=s=>{
  const t=String(s||'').replace(/<[^>]*>/g,'').replace(/["']/g,'').trim();
  if(!t) return '?';
  const w=t.split(/[\s,]+/).filter(Boolean);
  if(w.length>=2) return (w[0][0]+w[w.length-1][0]).toUpperCase();
  return t.slice(0,2).toUpperCase();
};
/* HubSpot-style relative time: Today 14:32 / Yesterday / Mar 4 / Mar 4, 2025 */
const relTime=iso=>{
  if(!iso) return '';
  const d=new Date(iso.replace(' ','T'));
  if(isNaN(d)) return esc(iso.slice(0,16));
  const now=new Date(), sd=new Date(d).setHours(0,0,0,0), td=new Date().setHours(0,0,0,0);
  const dd=Math.round((td-sd)/864e5);
  const hm=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
  if(dd===0) return 'Today '+hm;
  if(dd===1) return 'Yesterday '+hm;
  if(dd<7) return dd+' days ago';
  const mo=d.toLocaleDateString([], {month:'short',day:'numeric'});
  return d.getFullYear()===now.getFullYear()?mo:mo+', '+d.getFullYear();
};
const fsize=b=>{
  if(!b) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
};
/* linkify + escape for mail bodies */
const bodyHTML=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,
  '<a href="$1" target="_blank" rel="noopener">$1</a>');

async function loadEmails(){
  const b=document.getElementById('tabbody');
  b.innerHTML='<div class="empty">Searching mailbox via Microsoft Graph...</div>';
  const kws=(CUR.keywords&&CUR.keywords.length)?CUR.keywords:(CUR.contact_email?[CUR.contact_email]:[]);
  if(!kws.length&&!CUR.contact_email){b.innerHTML='<div class="empty">No search keywords or client contact for this deal.</div>';return;}
  try{
    /* Pass contact_email so the function can enforce the CLIENT-PARTICIPANT gate:
       a keyword says what mail is ABOUT, only the participants say who it's WITH.
       Without this the thread filled with vendors, robots and unrelated projects.
       sibling_keywords = keywords of OTHER deals sharing this same client contact
       (Dome has 3, Terrazas 2, North Bay Villas 3) so the client-address pass can't
       copy a sibling project's thread into this deal. */
    const sibs=[...new Set(DEALS.filter(d=>d.id!==CUR.id&&d.contact_email&&CUR.contact_email
        &&d.contact_email.toLowerCase()===CUR.contact_email.toLowerCase())
      .flatMap(d=>d.keywords||[]))].filter(k=>!(CUR.keywords||[]).includes(k));
    const ms=await fn({action:'search',keywords:kws,
      contact_email:CUR.contact_email||'',strict_client:CLIENT_ONLY,
      sibling_keywords:sibs});
    if(!ms.length){b.innerHTML=`<div class="empty">No client correspondence found.${CLIENT_ONLY?' <a href="#" onclick="toggleClientOnly();return false" style="color:var(--accent)">Show all keyword matches</a>':''}</div>`;return;}
    const head=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:11.5px;color:var(--gray-400)">${ms.length} message${ms.length>1?'s':''}</span>
      <label style="font-size:11px;color:var(--gray-500);display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" ${CLIENT_ONLY?'checked':''} onchange="toggleClientOnly()" style="width:auto;margin:0">
        Client mail only</label>
      <span style="font-size:11px;color:var(--gray-400);margin-left:auto">Newest first</span></div>`;
    b.innerHTML=head+'<div class="thread">'+ms.map(m=>{
      const who=m.direction==='in'?(m.from||m.from_addr||'Unknown')
        :((m.to_names&&m.to_names.length?m.to_names:m.to||[]).join(', ')||'—');
      const verb=m.direction==='in'?'emailed you':'you emailed';
      return `<div class="em">
        <div class="avatar ${m.direction}">${esc(initials(who))}</div>
        <div class="ecard" id="ec_${m.id}">
          <div class="ehd" onclick="expand('${m.id}')">
            <div class="er1">
              <span class="ewho">${esc(who)}</span>
              <span class="everb">${verb}</span>
              <span class="etime">${relTime(m.date)}</span>
            </div>
            <div class="esub">${esc(m.subject)}</div>
            <div class="eprev">${esc((m.preview||'').slice(0,160))}</div>
            <div class="emeta">
              <span class="chip ${m.direction}">${m.direction==='in'?'Received':'Sent'}</span>
              ${m.hasAttachments?'<span class="chip att">&#128206; Attachment</span>':''}
              ${m.cc_count?`<span class="chip att">+${m.cc_count} cc</span>`:''}
              ${m.matchedKeyword?`<span class="chip kw">${esc(m.matchedKeyword)}</span>`:''}
            </div>
          </div>
          <div class="slot"></div>
        </div></div>`;
    }).join('')+'</div>';
  }catch(e){b.innerHTML='<div class="empty err">Email error: '+esc(e.message)+'</div>';}
}
async function expand(mid){
  const card=document.getElementById('ec_'+mid);
  const slot=card.querySelector('.slot');
  if(slot.dataset.open){slot.innerHTML='';delete slot.dataset.open;card.classList.remove('open');return;}
  slot.dataset.open='1';card.classList.add('open');
  slot.innerHTML='<div class="ebd"><div class="empty" style="padding:14px">Loading message...</div></div>';
  try{
    const m=await fn({action:'message',id:mid});
    const list=a=>(a||[]).map(x=>esc(x.name||x.address)).join(', ')||'—';
    const parties=`<div class="parties">
      <div><span class="pk">From</span> ${esc(m.from?.name||m.from?.address||'—')}
        ${m.from?.address&&m.from.name?`<span style="color:var(--gray-400)">&lt;${esc(m.from.address)}&gt;</span>`:''}</div>
      <div><span class="pk">To</span> ${list(m.to)}</div>
      ${(m.cc&&m.cc.length)?`<div><span class="pk">Cc</span> ${list(m.cc)}</div>`:''}</div>`;
    const atts=(m.attachments&&m.attachments.length)?`<div class="atts">${m.attachments.map(a=>
      `<span class="att">&#128206;<span class="an">${esc(a.name)}</span><span class="az">${fsize(a.size)}</span></span>`).join('')}</div>`:'';
    const quoted=m.quoted?`<button class="qtoggle" onclick="event.stopPropagation();document.getElementById('q_${mid}').classList.toggle('on')">
        <span class="qdots">&middot;&middot;&middot;</span> Show earlier messages in this thread</button>
      <div class="quoted" id="q_${mid}">${bodyHTML(m.quoted)}</div>`:'';
    slot.innerHTML=`<div class="ebd">
      ${parties}
      <div class="mailbody">${bodyHTML(m.body||'(no text content)')}</div>
      ${atts}
      ${quoted}
      <div class="rbox">
        <label class="lb">Reply to all</label>
        <textarea id="rb_${mid}" placeholder="Write your reply..."></textarea>
        <div class="fl">
          <button class="pri" onclick="event.stopPropagation();doReply('${mid}')">Send reply</button>
          <span id="rs_${mid}"></span>

/* NOTE: `fsize` already exists at line ~1027 (used by email attachment chips) —

async function loadDocs(){

      check the folder number matches <b>${esc(CUR.project_no||'(blank)')}</b>.</span></div>`;

  /* Cross-reference sent mail before rendering so SENT/NOT SENT badges and the
     scan gate are correct on first paint. Failure is non-fatal: the tab still

  SENT_INDEX=await buildSentIndex();

/* Newest document that has a matching sent email — the revision the client
   most recently received. */
function newestSent(ds){
  let best=null,bestDate='';
  for(const x of ds){
    const si=sentInfo(x); if(!si) continue;
    const d=String(si.date||'');
    if(!best||d>bestDate){best=x;bestDate=d;}
  }
  return best;
}
/* Headline for the sent cross-reference: reports the latest revision the client
   holds, and warns when Dropbox has something newer that was never sent. */
function sentBanner(ds){
  if(!SENT_INDEX) return '';
  if(SENT_INDEX.error||!SENT_INDEX.checked){
    return `<div style="margin-bottom:10px;font-size:11.5px;color:var(--gray-400)">
      Send status unavailable (${esc(SENT_INDEX.error||'not checked')}) — documents listed without SENT badges.</div>`;
  }
  const ns=newestSent(ds);
  if(!ns){
    return `<div class="callout" style="border-left:3px solid var(--red);margin-bottom:10px">
      <b>Nothing sent yet</b><br><span style="font-size:11.5px;color:var(--gray-500)">
      No outbound email to ${esc(CUR.contact_email||'the client')} carries any of these files.</span></div>`;
  }
  const si=sentInfo(ns);
  /* "newer in Dropbox" = modified after the latest send, i.e. an unsent revision */
  const newer=ds.filter(x=>!sentInfo(x)&&x.modified_at&&si.date&&String(x.modified_at)>String(si.date));
  return `<div class="callout" style="border-left:3px solid ${newer.length?'#cf2e2e':'#1f6581'};margin-bottom:10px">
      <b>Latest sent to client:</b> ${esc(ns.file_name)} · ${esc(String(si.date||'').slice(0,10))}
      ${newer.length?`<br><span style="font-size:11.5px;color:#cf2e2e">
        ${newer.length} newer file${newer.length>1?'s':''} in Dropbox never sent — fee scanning is blocked on ${newer.length>1?'them':'it'}.</span>`:''}
    </div>`;
}
/* Copy a share link to the clipboard. Only offered for link_kind='shared_link'
   (a real Dropbox share URL that works for people outside the team); web_path
   links only resolve for signed-in Plaza members, so offering "copy" on those
   would hand William a URL that 404s for his client. */
async function copyDoc(id,btn){
  const d=(DOCS_CACHE||[]).find(x=>x.id===id); if(!d) return;
  const url=(d.url||'').replace('&dl=0','');
  try{ await navigator.clipboard.writeText(url); }
  catch(e){ const t=document.createElement('textarea');t.value=url;
    document.body.appendChild(t);t.select();document.execCommand('copy');t.remove(); }
  const was=btn.textContent; btn.textContent='Copied ✓';
  setTimeout(()=>{btn.textContent=was;},1400);
}

      if(u&&u.email) w.textContent=u.email;
    }).catch(()=>{});
  document.getElementById('npbtn').onclick=async()=>{
    const a=document.getElementById('np1').value, b=document.getElementById('np2').value;
    const err=document.getElementById('nperr');
    if(a.length<8){err.innerHTML='<span class="err">Password must be at least 8 characters.</span>';return;}
    if(a!==b){err.innerHTML='<span class="err">Passwords do not match.</span>';return;}
    err.textContent='Updating...';
    try{
      const r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tokens.access_token,'Content-Type':'application/json'},
        body:JSON.stringify({password:a})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.msg||d.message||d.error_description||'Update failed');
      err.innerHTML='<span class="ok">Password updated &check;</span>';
      SESSION={access_token:tokens.access_token,refresh_token:tokens.refresh_token,
               expires_at:Date.now()+(Number(tokens.expires_in)||3600)*1000};
      localStorage.setItem(LS,JSON.stringify(SESSION));
      history.replaceState(null,'',window.location.pathname);
      setTimeout(()=>{document.getElementById('recover').style.display='none';boot();},700);
    }catch(e){err.innerHTML='<span class="err">'+esc(e.message)+'</span>';}
  };
  document.getElementById('np2').addEventListener('keydown',e=>{
    if(e.key==='Enter')document.getElementById('npbtn').click();});
}

/* restore session on load */
(async()=>{
  const hp=parseHash();
  if(hp.error||hp.error_code){
    history.replaceState(null,'',window.location.pathname);
    document.getElementById('login').style.display='flex';
    document.getElementById('lerr').textContent=
      decodeURIComponent((hp.error_description||hp.error||'').replace(/\+/g,' '))
      +' — request a new reset link.';
    return;
  }
  if(hp.access_token&&(hp.type==='recovery'||hp.type==='invite')){
    showRecover(hp); return;
  }
  const raw=localStorage.getItem(LS);
  if(raw){
    try{
      SESSION=JSON.parse(raw);
      if(await tok()){await boot();return;}
    }catch(e){}
  }
  document.getElementById('login').style.display='flex';
})();
</script>
</body>
</html>
